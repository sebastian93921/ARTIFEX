services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artifex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artifex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artifex} -d ${POSTGRES_DB:-artifex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artifex:
    build:
      context: .
    image: artifex:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTIFEX_LANGUAGE: ${ARTIFEX_LANGUAGE:-en}
      ARTIFEX_PG_DSN: postgres://${POSTGRES_USER:-artifex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artifex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTIFEX_LLM_PROVIDER: ${ARTIFEX_LLM_PROVIDER:-}
      ARTIFEX_LLM_MODEL: ${ARTIFEX_LLM_MODEL:-}
      ARTIFEX_LLM_BASE_URL: ${ARTIFEX_LLM_BASE_URL:-}
      ARTIFEX_LLM_PROXY: ${ARTIFEX_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
