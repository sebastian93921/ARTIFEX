name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  agent-adapter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artifex_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: artifex_adapter_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artifex_test -d artifex_adapter_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: adapters/agent/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
        working-directory: adapters/agent
      - run: npm test && npm run check
        working-directory: adapters/agent
      - name: Test adapter against real backend
        env:
          ARTIFEX_ADAPTER_E2E: "1"
          ARTIFEX_PG_DSN: postgres://artifex_test:test_only_password@localhost:5432/artifex_adapter_e2e?sslmode=disable
        run: go test ./server -run '^TestAgentAdapterE2E$' -count=1 -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build:static
        working-directory: web
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artifex_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artifex_test -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check shell syntax
        run: |
          for script in *.sh; do bash -n "$script"; done
          sh -n start.sh
      - name: Run all Go packages with separate disposable databases
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: artifex_test
          PGPASSWORD: test_only_password
        run: |
          set -euo pipefail
          psql -d postgres -c 'SELECT 1'
          # Initialize the supplementary tables created during normal server startup.
          cat > "$RUNNER_TEMP/init-test-db.go" <<'GO'
          package main
          import (
            "log"
            "os"
            "github.com/sebastian93921/artifex/db"
          )
          func main() {
            store, err := db.Open(os.Getenv("ARTIFEX_PG_DSN"))
            if err != nil { log.Fatal(err) }
            defer store.Close()
            if err := store.EnsureLLMUsageTable(); err != nil { log.Fatal(err) }
            if err := store.EnsureLLMRecordsTable(); err != nil { log.Fatal(err) }
          }
          GO
          go build -o "$RUNNER_TEMP/init-test-db" "$RUNNER_TEMP/init-test-db.go"
          index=0
          status=0
          while IFS= read -r package; do
            index=$((index + 1))
            database="artifex_test_${index}"
            createdb "$database"
            ARTIFEX_PG_DSN="postgres://${PGUSER}:${PGPASSWORD}@localhost:5432/${database}?sslmode=disable" "$RUNNER_TEMP/init-test-db"
            if ! ARTIFEX_PG_DSN="postgres://${PGUSER}:${PGPASSWORD}@localhost:5432/${database}?sslmode=disable" go test -p 1 "$package" -count=1; then
              status=1
            fi
            dropdb --force "$database"
          done < <(go list ./...)
          exit "$status"
